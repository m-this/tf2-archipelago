name: Windows launcher

# The exe, as something to download and run on a Windows machine. Its own
# workflow so it does not drag the rest of CI along: this builds one artifact
# for a human to test, and CI minutes are worth more than a build nobody asked
# for.
on:
  workflow_dispatch:
  push:
    branches: [windows-native-launcher]

jobs:
  exe:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26
    steps:
      - name: install the fetch tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends nodejs git ca-certificates curl unzip zip make

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The workspace is a host directory owned by another user, so git calls
      # it dubiously owned and refuses to read it. The build reads it.
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The bot stack is downloads plus four spcomp runs. The pins, the patches
      # and the scripts are the only things that change what it produces.
      - uses: actions/cache@v6
        with:
          path: deploy/bots/build
          key: bots-${{ hashFiles('deploy/env/versions.env', 'deploy/patches/**', 'deploy/bots/*.sh') }}

      # The real embeds: the compiled plugin, ripext and the defender bots.
      - name: build tf2ap.exe
        run: |
          make plugin
          make launcher

      - uses: actions/upload-artifact@v4
        with:
          name: tf2ap-windows
          path: dist/tf2ap.exe
          retention-days: 14
