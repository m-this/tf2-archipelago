name: TF2 build watch

on:
  schedule:
    # Every two hours. The thing being fixed is a production server that sat 19
    # hours logging "Your server needs to be restarted" with nobody told, so the
    # bound that matters is "inside the evening it happened", not minutes.
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      known_build:
        description: Pretend the pins are for this TF2 build instead of the one in versions.env
        required: false
        type: string
      dry_run:
        description: Print the alert instead of opening an issue
        required: false
        default: false
        type: boolean

# One at a time, and never cancelled. Two runs overlapping would both look for
# an open issue, both find none, and both file one.
concurrency:
  group: tf2-build-watch
  cancel-in-progress: false

# What this is for: Valve shipped two TF2 updates on the evening of 2026-10-02
# and nothing here noticed. The order of events was players reporting that the
# server died when a bot bought an upgrade, then a debug bundle, then somebody
# reading Breakpad output by hand to find that SigMod was keyed to the previous
# build. This job is that notice, moved to before the first player joins.
#
# It asks Valve which build is live and compares it with TF2_SERVER_VERSION in
# deploy/env/versions.env, which is the last build the pins were checked
# against. Equal is silence. Different opens one issue naming both builds, every
# pin keyed to the game, and the failure each one causes.
#
# Once per change, not once per run: the issue title carries the new build id, so
# a run that finds an issue already naming that build says nothing. Two updates
# in one evening are two builds and two issues, which is what 2026-10-02 needed.
#
# A failed check is loud. There is no path here that logs a problem and exits 0:
# anything other than "up to date" or "a new build" fails the job, which is the
# notification GitHub sends for a scheduled workflow that failed. Three curl
# attempts cover a Steam blip; a Steam outage that outlasts them is worth being
# told about, because for its duration nothing is watching.
#
# GitHub-only, like the release and nightly jobs: `gh issue create` is GitHub's.
# The Forgejo mirror reads this file and skips it.
jobs:
  watch:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      stale: ${{ steps.check.outputs.stale }}
      current: ${{ steps.check.outputs.current }}
    steps:
      - uses: actions/checkout@v7

      - name: ask Valve which TF2 build is live
        id: check
        env:
          KNOWN_BUILD: ${{ inputs.known_build }}
        run: |
          . deploy/env/versions.env
          known=${KNOWN_BUILD:-$TF2_SERVER_VERSION}

          # The script prints the live build and exits 10 when it differs from
          # the one passed in. Any other non-zero is a failed check, and it goes
          # out of here as a failed job.
          status=0
          current=$(deploy/tf2-build-check.sh "$known") || status=$?
          case "$status" in
            0)
              echo "TF2 is on $current, which is what the pins were checked against."
              echo "stale=no" >> "$GITHUB_OUTPUT"
              ;;
            10)
              echo "TF2 moved from $known to $current."
              echo "stale=yes" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "the build check failed with exit $status; nothing is being watched until this works" >&2
              exit "$status"
              ;;
          esac
          echo "known=$known" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: see which depots moved
        if: steps.check.outputs.stale == 'yes'
        run: |
          set -euo pipefail
          . deploy/env/versions.env
          deploy/tf2-depot-manifests.sh > /tmp/tf2-depots.txt
          declare -A names=([232250]="content, both platforms" [232255]="Windows binaries" [232256]="Linux binaries")
          {
            while read -r depot manifest; do
              pin="TF2_DEPOT_${depot}_MANIFEST"
              if [ -z "${!pin:-}" ]; then
                state="no pinned manifest to compare with, taken as moved"
              elif [ "${!pin}" = "$manifest" ]; then
                state="unchanged"
              else
                state="moved from ${!pin}"
              fi
              printf -- '- %s (%s): manifest %s, %s\n' "$depot" "${names[$depot]}" "$manifest" "$state"
            done < /tmp/tf2-depots.txt
          } > /tmp/tf2-depots.md
          cat /tmp/tf2-depots.md

      # The pins go in the text rather than a link to the file, so somebody
      # reading this on a phone at 23:00 already has the values.
      - name: write the alert
        if: steps.check.outputs.stale == 'yes'
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          KNOWN: ${{ steps.check.outputs.known }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          . deploy/env/versions.env
          # Every format string below is single-quoted on purpose: the backticks
          # are markdown and the values arrive as printf arguments.
          # shellcheck disable=SC2016
          {
            printf 'TF2 is on ServerVersion %s. `TF2_SERVER_VERSION` in `deploy/env/versions.env`\n' "$CURRENT"
            printf 'is %s, so the pins keyed to the game are a build behind. Each one below fails\n' "$KNOWN"
            printf 'differently and none of them warn first: without this issue the first report is\n'
            printf 'a player saying the server died.\n\n'

            printf '### Which depots moved\n\n'
            cat /tmp/tf2-depots.md
            printf '\n232255 and 232256 hold server.dll and the Linux binaries: when one is\n'
            printf 'unchanged, that platform'\''s SigMod only needs a new build key.\n\n'

            printf 'Worst first.\n\n'

            printf '### SigMod for Windows, pinned at `SIGSEGV_MVM_WINDOWS_VERSION=%s`\n\n' "$SIGSEGV_MVM_WINDOWS_VERSION"
            printf 'A SigMod build knows one TF2 ServerVersion. On any other, `IAddr_FixedAddr`\n'
            printf 'refuses every fixed address and the server faults: at extension load, when\n'
            printf 'anybody buys an upgrade (bots included), or when a player inspects a weapon.\n'
            printf 'Regenerate `package-windows.zip` in `m-this/sigsegv-mvm-win` against %s,\n' "$CURRENT"
            printf 'then bump `SIGSEGV_MVM_WINDOWS_VERSION` and `SIGSEGV_MVM_WINDOWS_SHA256`.\n\n'

            printf '### SigMod for Linux, pinned at `SIGSEGV_MVM_VERSION=%s`\n\n' "$SIGSEGV_MVM_VERSION"
            printf 'Same cause, same three crashes. Rebuild `rafradek/sigsegv-mvm` master against\n'
            printf 'the current `hl2sdk` `tf2` branch, then bump `SIGSEGV_MVM_VERSION` and\n'
            printf '`SIGSEGV_MVM_SHA256`.\n\n'

            printf '### SourceMod, pinned at `SOURCEMOD_VERSION=%s`\n\n' "$SOURCEMOD_VERSION"
            printf 'A TF2 update can move the KeyValues layout SourceMod reads, and the 2026-10-02\n'
            printf 'one did. On a snapshot older than the fix, a real client joining segfaults the\n'
            printf 'server and an `MVM_Upgrade` sent by a plugin is refused silently, so bots shop\n'
            printf 'and buy nothing: alliedmodders/sourcemod#2587, fixed by #2588 in\n'
            printf '`1.12.0-git7255`. Check whether this update moved it again, and that the pin is\n'
            printf 'at or past the snapshot that absorbed it.\n\n'

            printf '### The running server, which needs restarting either way\n\n'
            printf 'srcds keeps the build it started with. Once players update, an un-restarted\n'
            printf 'server refuses all of them and logs `Your server needs to be restarted in order\n'
            printf 'to receive the latest update` until somebody looks. On the Compose deployment:\n'
            printf '`docker compose restart srcds`, which updates TF2 on the way up.\n\n'

            printf '### Then close this\n\n'
            printf 'Set `TF2_SERVER_VERSION=%s` in `deploy/env/versions.env` once the pins above\n' "$CURRENT"
            printf 'are right. That is what stops this being filed again.\n\n'
            printf 'Once m-this/sigsegv-mvm-win has published a Windows release for this build, the\n'
            printf 'same workflow opens a pull request with those pins and launches the beds, and\n'
            printf 'this issue is the one it closes.\n\n'

            printf -- '---\n\n'
            printf 'Valve'\''s own answer, no credentials: `ISteamApps/UpToDateCheck/v1` for app 440.\n'
            printf 'Filed by `.github/workflows/tf2-build-watch.yml` ([run](%s)).\n' "$RUN_URL"
          } > /tmp/tf2-build-alert.md
          cat /tmp/tf2-build-alert.md

      - name: tell the maintainer
        if: steps.check.outputs.stale == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT: ${{ steps.check.outputs.current }}
          KNOWN: ${{ steps.check.outputs.known }}
          DRY_RUN: ${{ inputs.dry_run }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: the alert above was not filed"
            exit 0
          fi

          # The open issue is the record of having said this, so no state is
          # written anywhere. Listing and matching here rather than passing a
          # query to the search API, because that index lags behind by minutes
          # and this job runs again in two hours.
          titled="TF2 server build $CURRENT "
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title | startswith(\"$titled\"))) | .[0].number // empty")
          if [ -n "$existing" ]; then
            echo "#$existing already covers build $CURRENT"
            exit 0
          fi

          # Assigned, not just filed. Somebody who has muted this repository's
          # feed still gets a notification for an issue put on them, and the
          # whole point is to hear about this before a player does.
          gh issue create \
            --title "${titled}is live (pins are for $KNOWN)" \
            --assignee "$OWNER" \
            --body-file /tmp/tf2-build-alert.md

  # Step one of the TF2 update, done by the machine: once the Windows SigMod
  # release for the new build exists, the pull request that moves every pin keyed
  # to it. Everything in it is read, none of it typed: the version and the
  # checksum off the release (its .sha256 asset, never recomputed), the manifests
  # off Steam. Merging and tagging stay a person's.
  #
  # Runs every two hours with the watcher until the release is there, and is a
  # no-op after the branch exists, merged or not, so the pull request is opened
  # once per build.
  pins:
    needs: watch
    if: github.server_url == 'https://github.com' && needs.watch.outputs.stale == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reads only: every write below (push, pull request, dispatch) is made with
    # SIGSEGV_DISPATCH_TOKEN, because a push or a pull request made with the
    # job's own token starts no CI run and cannot start sigsegv-mvm-win's beds.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CURRENT: ${{ needs.watch.outputs.current }}
      DRY_RUN: ${{ inputs.dry_run }}
      SIGMOD_REPO: m-this/sigsegv-mvm-win
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.SIGSEGV_DISPATCH_TOKEN || github.token }}

      - name: stop when the pull request already exists
        id: existing
        run: |
          set -euo pipefail
          branch="mfe/chore/tf2-$CURRENT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          prs=$(gh pr list --state all --head "$branch" --json number --jq 'length')
          if [ "$prs" != 0 ] || git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists; nothing to open"
            if [ "$DRY_RUN" = true ]; then
              echo "dry run: going on anyway, to show what would have been opened"
              echo "done=no" >> "$GITHUB_OUTPUT"
            else
              echo "done=yes" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "done=no" >> "$GITHUB_OUTPUT"
          fi

      # The newest of the last five releases that says it is for this build.
      # Not yet published is a normal state, not a failure: the next run looks again.
      - name: find the Windows SigMod release for this build
        id: release
        if: steps.existing.outputs.done == 'no'
        run: |
          set -euo pipefail
          for tag in $(gh api "repos/$SIGMOD_REPO/releases?per_page=5" --jq '.[].tag_name'); do
            build=$(gh release download "$tag" -R "$SIGMOD_REPO" -p package-windows.build.json -O - | jq -r .build)
            if [ "$build" = "$CURRENT" ]; then
              sha256=$(gh release download "$tag" -R "$SIGMOD_REPO" -p package-windows.zip.sha256 -O - | cut -d' ' -f1)
              echo "SigMod for Windows $tag is for $CURRENT, package-windows.zip $sha256"
              { echo "found=yes"; echo "tag=$tag"; echo "sha256=$sha256"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no SigMod for Windows release for $CURRENT yet; the next run looks again"
          echo "found=no" >> "$GITHUB_OUTPUT"

      # No fallback to the job's token: it would push a branch and open a pull
      # request that no CI run ever checks.
      - name: require the token that starts CI
        if: steps.release.outputs.found == 'yes' && !inputs.dry_run
        env:
          SIGMOD_TOKEN: ${{ secrets.SIGSEGV_DISPATCH_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ -z "$SIGMOD_TOKEN" ]; then
            msg="SigMod for Windows $TAG exists for TF2 $CURRENT, but the secret SIGSEGV_DISPATCH_TOKEN is not set, so no pins pull request was opened."
            echo "::error::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: write the pins
        id: pins
        if: steps.release.outputs.found == 'yes'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          . deploy/env/versions.env
          deploy/tf2-depot-manifests.sh > /tmp/tf2-depots.txt

          # The release names the Windows depot manifest it was made from. If
          # Steam serves another one now, the release is for a build that is no
          # longer the live one and a pin made from the two would be a lie.
          release_manifest=$(gh release download "$TAG" -R "$SIGMOD_REPO" -p package-windows.build.json -O - | jq -r .manifest)
          served=$(awk '$1 == 232255 { print $2 }' /tmp/tf2-depots.txt)
          [ "$release_manifest" = "$served" ] || { echo "release $TAG was made from depot 232255 manifest $release_manifest, Steam serves $served" >&2; exit 1; }

          declare -A names=([232250]="content" [232255]="Windows binaries" [232256]="Linux binaries")
          moved=()
          while read -r depot manifest; do
            pin="TF2_DEPOT_${depot}_MANIFEST"
            [ "${!pin:-}" = "$manifest" ] || moved+=("$depot (${names[$depot]})")
          done < /tmp/tf2-depots.txt
          list=$(printf '%s, ' "${moved[@]}")
          echo "moved=${list%, }" >> "$GITHUB_OUTPUT"

          args=()
          while read -r depot manifest; do args+=(--manifest "$depot=$manifest"); done < /tmp/tf2-depots.txt
          python3 deploy/tf2_pins.py --versions deploy/env/versions.env --changelog CHANGELOG.md \
            --build "$CURRENT" --windows-version "$TAG" --windows-sha256 "$SHA256" "${args[@]}"
          git --no-pager diff

      - name: write the description
        if: steps.release.outputs.found == 'yes'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MOVED: ${{ steps.pins.outputs.moved }}
        run: |
          set -euo pipefail
          . deploy/env/versions.env
          issue=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title | startswith(\"TF2 server build $CURRENT \"))) | .[0].number // empty")
          # shellcheck disable=SC2016
          {
            printf 'TF2 %s moved depot(s) %s. SigMod for Windows %s is the build made for it.\n\n' "$CURRENT" "$MOVED" "$TAG"
            printf -- '- `SIGSEGV_MVM_WINDOWS_VERSION` and `_SHA256`: release %s, the checksum is the one in its `package-windows.zip.sha256`.\n' "$TAG"
            printf -- '- `TF2_SERVER_VERSION` and `SOURCEMOD_TF2_SERVER_VERSION` move to %s, with the three depot manifests.\n' "$CURRENT"
            printf -- '- CHANGELOG: an Unreleased entry.\n\n'
            printf '@@BEDS@@\n'
            printf 'To check before merging: the comments above the pins, which still describe the previous build,\n'
            printf 'and `SIGSEGV_MVM_VERSION` / `SOURCEMOD_VERSION` if a bed shows they need to move. After merge: `docker compose restart srcds`.\n'
            if [ -n "$issue" ]; then printf '\nCloses #%s\n' "$issue"; fi
          } > /tmp/pr-body.md

      - name: dry run, nothing is pushed
        if: steps.release.outputs.found == 'yes' && inputs.dry_run
        run: |
          echo "dry run: branch ${{ steps.existing.outputs.branch }} and its pull request were not made. Title and description:"
          echo "chore(deps): pin everything keyed to TF2 $CURRENT"
          sed 's/^@@BEDS@@$/(the beds are not launched in a dry run)/' /tmp/pr-body.md

      - name: open the pull request
        id: pr
        if: steps.release.outputs.found == 'yes' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.SIGSEGV_DISPATCH_TOKEN }}
          BRANCH: ${{ steps.existing.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout -b "$BRANCH"
          git commit -am "chore(deps): pin everything keyed to TF2 $CURRENT"
          git push origin "$BRANCH"
          url=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): pin everything keyed to TF2 $CURRENT" \
            --body-file /tmp/pr-body.md)
          echo "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The token starts workflows in m-this/sigsegv-mvm-win, which the job's own cannot.
      - name: launch the beds
        if: steps.pr.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.SIGSEGV_DISPATCH_TOKEN }}
          BRANCH: ${{ steps.existing.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          beds="Beds on this branch, with defender bots:"
          for workflow in linuxbed.yml windows.yml; do
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run "$workflow" -R "$SIGMOD_REPO" --ref main \
              -f archipelago_ref="$BRANCH" -f bots=true
            run=
            for _ in 1 2 3 4 5 6; do
              sleep 10
              run=$(gh run list -R "$SIGMOD_REPO" -w "$workflow" --event workflow_dispatch \
                --json databaseId,createdAt --jq "map(select(.createdAt >= \"$started\")) | .[0].databaseId // empty")
              [ -z "$run" ] || break
            done
            [ -n "$run" ] || { echo "no $workflow run appeared within a minute" >&2; exit 1; }
            beds="$beds
          - $workflow: https://github.com/$SIGMOD_REPO/actions/runs/$run"
          done
          python3 -I - "$beds" <<'PY'
          import sys
          body = open("/tmp/pr-body.md").read().replace("@@BEDS@@", sys.argv[1] + "\n")
          open("/tmp/pr-body.md", "w").write(body)
          PY
          gh pr edit "$PR_URL" --body-file /tmp/pr-body.md
