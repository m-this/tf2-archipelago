name: Release

on:
  push:
    tags: ["v*"]

# GitHub-only, like the `pages` job in ci.yml: ghcr.io, the release API and the
# `gh` CLI are all GitHub's. The Forgejo mirror reads this file and skips it.
#
# No `make check`: the tag points at a commit CI already passed on main. The
# version check below is the one thing a tag can get wrong on its own.
jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # The attestation below is signed with a short-lived certificate this job
      # gets from Sigstore, and id-token is how it asks for one.
      id-token: write
      attestations: write
    env:
      VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # `make dist` cross-compiles the launcher, so this job needs the Go the
      # module asks for, not whatever the runner image happens to carry.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: name the images
        run: |
          echo "IMAGE=ghcr.io/${{ github.repository }}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Before any push: a tag that disagrees with the tree ships a version
      # nobody released.
      - name: check the version
        run: make version-check

      - name: log in to ghcr.io
        run: |
          echo "${{ github.token }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The same Dockerfiles and pins a clone builds from, so what runs from
      # ghcr.io is what runs from `make up`. Every tag moves `latest` too,
      # because this project cuts no prereleases.
      - name: build and push the bridge image
        run: |
          docker build -f deploy/Dockerfile.bridge \
            -t "$IMAGE/bridge:$GITHUB_REF_NAME" -t "$IMAGE/bridge:latest" .
          deploy/push-image.sh --all-tags "$IMAGE/bridge"

      - name: build and push the srcds image
        run: |
          . deploy/env/versions.env
          docker build -f deploy/Dockerfile.srcds \
            --build-arg "RIPEXT_VERSION=$RIPEXT_VERSION" \
            --build-arg "SIGSEGV_MVM_VERSION=$SIGSEGV_MVM_VERSION" \
            --build-arg "SIGSEGV_MVM_SHA256=$SIGSEGV_MVM_SHA256" \
            -t "$IMAGE/srcds:$GITHUB_REF_NAME" -t "$IMAGE/srcds:latest" .
          deploy/push-image.sh --all-tags "$IMAGE/srcds"

      - name: build and push the archipelago image
        run: |
          . deploy/env/versions.env
          docker build -f deploy/Dockerfile.archipelago \
            --build-arg "ARCHIPELAGO_VERSION=$ARCHIPELAGO_VERSION" \
            -t "$IMAGE/archipelago:$GITHUB_REF_NAME" \
            -t "$IMAGE/archipelago:latest" .
          deploy/push-image.sh --all-tags "$IMAGE/archipelago"

      - name: build the files
        run: make dist

      # A downloaded stack then keeps the release it came with until
      # TF2AP_VERSION says otherwise.
      - name: pin the compose file to this tag
        run: sed -i "s/:-latest}/:-$GITHUB_REF_NAME}/g" dist/compose.yaml

      # CHANGELOG.md is written for somebody who plays the game, one section per
      # tag. A release with no section still publishes: the marker is dropped
      # and the notes read as they did before this existed.
      - name: put this tag's changes in the notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 == "## " tag { want = 1; next }
            want && /^## / { exit }
            want { print }
          ' CHANGELOG.md > /tmp/changes.md

          if [ -s /tmp/changes.md ]; then
            printf '## Changes\n' > /tmp/section.md
            cat /tmp/changes.md >> /tmp/section.md
          else
            echo "no CHANGELOG.md section for $GITHUB_REF_NAME" >&2
            : > /tmp/section.md
          fi

          awk '
            /<!-- CHANGES -->/ { while ((getline line < "/tmp/section.md") > 0) print line; next }
            { print }
          ' .github/release-notes.md > /tmp/release-notes.md

      # Signing runs before anything reads the files: the checksums, the
      # attestation and the upload all have to describe the signed exe, not the
      # one that went into signing. signtool rewrites the PE checksum as part of
      # signing, so the value pechecksum wrote survives as a correct one.
      #
      # Skipped until the SignPath application is granted and the token exists,
      # in which case the unsigned exe ships as it does today. Only the exe is
      # signed: Authenticode has nothing to say about an ELF binary.
      - name: stage the exe for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: tf2ap-unsigned
          path: dist/tf2ap.exe
          if-no-files-found: error

      - name: sign the exe
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tf2-archipelago
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      # The assets, named once. The checksums cover exactly what is uploaded, so
      # the list cannot drift from the file it describes. dist/ holds build
      # intermediates too; those are not release files and are not hashed.
      - name: name the assets
        run: |
          {
            echo 'ASSETS<<EOF'
            for f in tf2ap.exe tf2ap-linux-amd64 compose.yaml env.example \
                     tf2_mvm.apworld tf2_archipelago.smx tf2-defender-bots.zip \
                     meta.json items.json missions.json; do
              echo "dist/$f"
            done
            echo EOF
          } >> "$GITHUB_ENV"

      # `tf2ap.exe` is unsigned, so Windows warns about it and players are right
      # to want to check what they downloaded. Until TODO item 2 lands, this
      # and the VirusTotal step below are what they have.
      - name: checksum the assets
        run: |
          cd dist
          # shellcheck disable=SC2086
          sha256sum $(echo "$ASSETS" | sed 's|^dist/||') > SHA256SUMS
          cat SHA256SUMS

      # Ties each binary's hash to this repository, this workflow and this commit,
      # signed by Sigstore. It is not an Authenticode signature and Windows does
      # not read it, so it changes no scanner's mind. What it gives is a check
      # anybody can run against a file they already downloaded:
      #
      #   gh attestation verify tf2ap.exe --repo m-this/tf2-archipelago
      - name: attest the binaries
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/tf2ap.exe
            dist/tf2ap-linux-amd64

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md \
            --generate-notes \
            $ASSETS dist/SHA256SUMS

      # Uploads the two binaries, so nobody has to take "it is a false positive"
      # on trust. Skipped when the key is not set: a missing scan must not fail
      # a release.
      - name: scan the binaries
        id: scan
        if: env.VT_API_KEY != ''
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          files: |
            dist/tf2ap.exe
            dist/tf2ap-linux-amd64

      # The action's own update_release_body only works when a `release` event
      # carries the release in its payload. This workflow runs on a tag push, so
      # it silently does nothing and the links stay in a step output. Append them
      # here instead. Read the body back rather than reusing the notes file:
      # --generate-notes added the compare link, and that must survive.
      - name: link the scans in the notes
        if: steps.scan.outputs.analysis != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS: ${{ steps.scan.outputs.analysis }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > /tmp/body.md
          {
            printf '\n## VirusTotal\n\n'
            echo "$ANALYSIS" | tr ',' '\n' | while IFS= read -r pair; do
              [ -n "$pair" ] || continue
              printf -- '- [`%s`](%s)\n' \
                "$(basename "${pair%%=*}")" "${pair#*=}"
            done
          } >> /tmp/body.md
          gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/body.md
