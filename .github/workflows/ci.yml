name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Four languages, four jobs, each on the smallest image that can run it. Every
# step is a make target: what runs here is what runs on a laptop, and `make
# check` runs all of it in one go.
#
# This file runs on both forges: Forgejo picks up .github/workflows too, and the
# homelab runner registers an ubuntu-latest label, so nothing here may use a
# label or an action that only one of the two knows about.
jobs:
  go:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26
    steps:
      # checkout is a JavaScript action, so the runner execs node inside the
      # container. None of the images below ship one; every one is Debian.
      # GitHub mounts its own node into the container and would not need this;
      # the Forgejo runner does not, so the install stays.
      - name: install node
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends nodejs

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/cache@v6
        with:
          path: /root/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # The workspace is a host directory owned by the runner's own user, bind
      # mounted into a container that runs as root, so git calls the repository
      # dubiously owned and refuses to read it. Nothing above needs git, but the
      # VCS stamp `go build` puts in a binary does, and it fails the build with
      # `error obtaining VCS status: exit status 128`. The other way out,
      # -buildvcs=false in the Makefile, drops the stamp on a laptop too.
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: gofumpt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

      - name: go fix
        run: make fix-check

      - name: go build
        run: make compile

      # The race detector is the only thing in this pipeline that can see a
      # data race, and the bridge is three goroutines around one state store.
      # This step also guards the committed export: the gamedata tests
      # regenerate it and fail if the tree is stale.
      - name: go test -race -shuffle=on
        run: make test

      # Reports only the vulnerabilities whose vulnerable symbol this code can
      # actually reach, so red here is a real exposure, not a CVE headline.
      - name: govulncheck
        run: make vuln

  apworld:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    steps:
      - name: install node, git and make
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends nodejs git make

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: ruff
        run: make apworld-lint

  plugin:
    runs-on: ubuntu-latest
    container:
      image: debian:stable-slim
    steps:
      - name: install node and the fetch tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends nodejs git ca-certificates curl unzip make

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Warnings are errors here. A SourcePawn warning is usually a symbol that
      # silently does nothing at runtime.
      - name: spcomp
        run: make plugin

      # The bot stack is downloads plus four spcomp runs, so the cache is what
      # keeps it cheap: the pins and the patches are the only things that
      # change what it produces, and both are hashed into the key.
      - uses: actions/cache@v6
        with:
          path: deploy/bots/build
          key: bots-${{ hashFiles('deploy/env/versions.env', 'deploy/patches/**', 'deploy/bots/*.sh') }}

      # Proves the patches still apply and the mod still compiles. The image
      # runs the same script, so a break shows up here rather than at a tag.
      - name: defender bots
        run: make bots

  # Needs a runner with a Docker daemon it can reach: it builds images and
  # brings a stack up. Without one, these two targets are the ones to run by
  # hand before a release. No container: on GitHub the label is a VM with a
  # daemon, and the homelab runner's ubuntu-latest image reaches its DinD.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The world's tests need Archipelago to run inside, so they run in the
      # image that has it.
      - name: apworld tests
        run: make apworld-test

      # docs/ is a published site. A book that stops building should fail here
      # rather than at the domain.
      - name: book
        run: make docs-build

      # A merge that stops the compose file rendering fails here, not on the
      # tag, where the workflow already pushed half the release.
      - name: release compose file
        run: make compose-release

      # Archipelago and the bridge, for real, driven the way the plugin drives
      # them. The game server is not in it: 14 GB, and it proves nothing
      # without a human at a Team Fortress 2 client.
      - name: integration
        run: make integration

  # GitHub-only: Pages and its deploy actions do not exist on the Forgejo
  # runner. Everything else in this file runs on both; this job opts out with
  # its own `if` instead of moving out to a second workflow file.
  #
  # Runs after the other four are green, and only for a push to main: a PR
  # gets the same build check via `stack`'s `book` step, not a deploy.
  pages:
    needs: [go, apworld, plugin, stack]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Same image the `book` step already validated, so the build has one
      # definition. No CNAME file in the artifact: the book stays on the
      # github.io address Pages gives it, under no domain of mine.
      - name: build the book
        run: |
          make docs-build
          id=$(docker create tf2-archipelago-docs)
          docker cp "$id:/usr/share/nginx/html" book
          docker rm "$id"

      # Artifacts are immutable and stay attached to the run, so a re-run adds
      # a second one under the same name and deploy-pages refuses to guess:
      # "Multiple artifacts named github-pages". The attempt number in the name
      # gives each attempt its own.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: book

      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
