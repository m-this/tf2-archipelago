name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Five languages, five jobs, each on the smallest image that can run it. Every
# step is a make target: what runs here is what runs on a laptop, and `make
# check` runs all of it in one go.
#
# This file runs on both forges: Forgejo picks up .github/workflows too, and the
# homelab runner registers an ubuntu-latest label, so nothing here may use a
# label or an action that only one of the two knows about.
jobs:
  go:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27.3
    steps:
      # checkout is a JavaScript action, so the runner execs node inside the
      # container. None of the images below ship one; every one is Debian.
      # GitHub mounts its own node into the container and would not need this;
      # the Forgejo runner does not, so the install stays.
      - name: install node
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends nodejs

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/cache@v6
        with:
          path: |
            /root/.cache/go-build
            /root/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # The workspace is a host directory owned by the runner's own user, bind
      # mounted into a container that runs as root, so git calls the repository
      # dubiously owned and refuses to read it. Nothing above needs git, but the
      # VCS stamp `go build` puts in a binary does, and it fails the build with
      # `error obtaining VCS status: exit status 128`. The other way out,
      # -buildvcs=false in the Makefile, drops the stamp on a laptop too.
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: gofumpt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

      - name: go fix
        run: make fix-check

      - name: go build
        run: make compile

      # The launcher is a Windows exe cross-compiled from Go, window and all:
      # walk is pure Go, so this needs no toolchain. `make compile` above put
      # the embed placeholders in place; the real assets are fetched by `make
      # launcher-assets` in the release workflow.
      - name: launcher cross-compile
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./launcher/cmd/tf2ap

      # The race detector is the only thing in this pipeline that can see a
      # data race, and the bridge is three goroutines around one state store.
      # This step also guards the committed export: the gamedata tests
      # regenerate it and fail if the tree is stale.
      - name: go test -race -shuffle=on
        run: make test

      # Reports only the vulnerabilities whose vulnerable symbol this code can
      # actually reach, so red here is a real exposure, not a CVE headline.
      - name: govulncheck
        run: make vuln

  # The browser interface. Its TypeScript is generated from proto/ by buf, which
  # is a Go program, so this job carries both toolchains: one generator on every
  # machine. npm runs directly here, the way it does in every other image; a
  # laptop gets the container through the plain `make web-check`.
  web:
    runs-on: ubuntu-latest
    container:
      image: node:26.11.1-slim
    steps:
      # ca-certificates is not optional: node:26.11.1-slim ships none, so git cannot
      # verify github.com and checkout fails with "Problem with the SSL CA
      # cert" before anything else runs. npm needs it for the same reason.
      # The plugin job installs it on debian:stable-slim for the same reason.
      - name: install git, make and the CA certificates
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git make

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: buf lint and format
        run: make proto-lint

      # eslint, prettier, the component tests, and `ng build` under the 500 kB
      # initial budget, which is an error rather than a warning: the budget is
      # the point.
      - name: eslint, prettier, vitest and the bundle budget
        run: make web-check-direct

      # The browser tests drive the real app against the fake launcher: the real
      # handlers, the real WebSocket and the real form model. They are here
      # rather than in `make check` because the browser is a 150 MB download
      # that no other target needs.
      - name: Playwright against the fake launcher
        run: make web-e2e-direct

      # Both: the report says which test failed, and test-results holds the
      # trace and the error context Playwright keeps for one that did.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            launcher/web/playwright-report
            launcher/web/test-results
          retention-days: 7
          if-no-files-found: warn

  apworld:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    steps:
      - name: install node, git and make
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends nodejs git make

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: ruff
        run: make apworld-lint

  plugin:
    runs-on: ubuntu-latest
    container:
      image: debian:stable-slim
    steps:
      - name: install node and the fetch tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends nodejs git ca-certificates curl unzip make python3 python3-packaging g++

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The defender mod is a Go module dependency rather than a checkout, so
      # staging it needs a toolchain. Version from go.mod, the same file that
      # pins the mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Warnings are errors here. A SourcePawn warning is usually a symbol that
      # silently does nothing at runtime.
      - name: spcomp
        run: make plugin

      # The bot stack is three extension builds plus four spcomp runs, so the cache is
      # what keeps it cheap: the pins and the patches are the only things that
      # change what it produces, and all of them are hashed into the key.
      #
      # go.mod and go.sum are in there because the mod's generated SourcePawn is
      # written by a tool this module pins. Without them a bump of that pin
      # would restore a cached tree built by the old one and nothing would say
      # so, which is the drift the check inside build.sh exists to catch.
      - uses: actions/cache@v6
        with:
          path: deploy/bots/build
          key: bots-${{ hashFiles('deploy/env/versions.env', 'deploy/patches/**', 'deploy/bots/*.sh', 'deploy/bots/*.py', 'go.mod', 'go.sum') }}

      # The extensions are built from source against SourceMod 1.13's headers,
      # for 32-bit Linux.
      - name: extension toolchain
        run: |
          sudo=; [ "$(id -u)" = 0 ] || sudo=sudo
          $sudo apt-get update
          $sudo apt-get install --yes --no-install-recommends python3 clang gcc-multilib g++-multilib

      # Proves the remaining patches still apply and the mod still compiles. The
      # image runs the same script, so a break shows up here rather than at a tag.
      - name: defender bots
        run: make bots

  # Needs a runner with a Docker daemon it can reach: it builds images and
  # brings a stack up. Without one, these two targets are the ones to run by
  # hand before a release. No container: on GitHub the label is a VM with a
  # daemon, and the homelab runner's ubuntu-latest image reaches its DinD.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The world's tests need Archipelago to run inside, so they run in the
      # image that has it.
      - name: apworld tests
        run: make apworld-test

      # docs/ is a published site. A book that stops building should fail here
      # rather than at the domain.
      - name: book
        run: make docs-build

      # A merge that stops the compose file rendering fails here, not on the
      # tag, where the workflow already pushed half the release.
      - name: release compose file
        run: make compose-release

      # Archipelago and the bridge, for real, driven the way the plugin drives
      # them. The game server is not in it: 14 GB, and it proves nothing
      # without a human at a Team Fortress 2 client.
      - name: integration
        run: make integration

  # GitHub-only: Pages and its deploy actions do not exist on the Forgejo
  # runner. Everything else in this file runs on both; this job opts out with
  # its own `if` instead of moving out to a second workflow file.
  #
  # Runs after the other five are green, and only for a push to main: a PR
  # gets the same build check via `stack`'s `book` step, not a deploy.
  pages:
    needs: [go, web, apworld, plugin, stack]
    if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      # The root remains the documentation book. Make the repository's Pages
      # deployment button open the player-facing tracker directly.
      url: ${{ steps.deployment.outputs.page_url }}tracker/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Same image the `book` step already validated, so the build has one
      # definition. No CNAME file in the artifact: the book stays on the
      # github.io address Pages gives it, under no domain of mine.
      - name: build the Pages sites
        run: |
          make docs-build
          id=$(docker create tf2-archipelago-docs)
          docker cp "$id:/usr/share/nginx/html" book
          docker rm "$id"

          # The tracker is a standalone Angular entry point. Keep it below the
          # book so one Pages deployment serves both sites without making the
          # documentation image carry a browser toolchain.
          make tracker-build
          mkdir -p book/tracker
          cp -a dist/tracker/. book/tracker/

      # Artifacts are immutable and stay attached to the run, so a re-run adds
      # a second one under the same name and deploy-pages refuses to guess:
      # "Multiple artifacts named github-pages". The attempt number in the name
      # gives each attempt its own.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: book

      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
