# The whole stack: one Team Fortress 2 server, one bridge, and the multiworld
# the bridge plays on.
#
# Run it from the repository root:
#
#   cp deploy/.env.example .env && $EDITOR .env
#   make seed                                   # then upload it and open a room
#   make up
#
# The multiworld is somebody else's process by default: archipelago.gg hosts
# the seed and the bridge dials out to it. COMPOSE_PROFILES=selfhost brings the
# `archipelago` service back and hosts it here instead.
#
# The project name is pinned so the game volume keeps its name across
# rebuilds. Re-downloading 14 GB because a directory was renamed is not a
# mistake worth being able to make.
name: tf2-archipelago

services:
  # The multiworld, hosted here rather than on archipelago.gg. Off unless
  # COMPOSE_PROFILES=selfhost, and it wants AP_HOST=archipelago with
  # AP_PORT=38281 and AP_TLS=false in .env.
  archipelago:
    profiles: ["selfhost"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.archipelago
      args:
        ARCHIPELAGO_VERSION: ${ARCHIPELAGO_VERSION:?set it in deploy/env/versions.env}
    restart: unless-stopped
    # The shape of the run passes through with no default: the entrypoint owns
    # the defaults, and an empty value falls through to them. Two files can
    # generate a seed, and they must not each carry their own idea of what an
    # unset option means.
    environment:
      MVM_MISSION_COUNT: ${MVM_MISSION_COUNT:-}
      MVM_DIFFICULTY: ${MVM_DIFFICULTY:-}
      MVM_GOAL: ${MVM_GOAL:-}
      MVM_MISSIONSANITY_PERCENTAGE: ${MVM_MISSIONSANITY_PERCENTAGE:-}
      MVM_DEATH_LINK: ${MVM_DEATH_LINK:-}
      MVM_EXCLUDED_MISSIONS: ${MVM_EXCLUDED_MISSIONS:-}
      MVM_START_MISSION: ${MVM_START_MISSION:-}
      MVM_START_CLASS: ${MVM_START_CLASS:-}
      MVM_COMMUNITY_MISSIONS: ${MVM_COMMUNITY_MISSIONS:-}
      SRCDS_MODS: ${SRCDS_MODS:-}
      AP_PORT: ${AP_PORT:?set AP_PORT in .env}
      AP_SLOT_NAME: ${AP_SLOT_NAME:-tf2}
      AP_PASSWORD: ${AP_PASSWORD:-}
    volumes:
      - apoutput:/ap/output
    # Deliberately not published. One slot covers the whole game server, so
    # nothing outside this stack needs to reach Archipelago. Publish
    # 127.0.0.1:38281:38281 here if a friend wants to play another game in the
    # same multiworld, or host the seed on archipelago.gg and skip the port.

  srcds:
    build:
      context: .
      dockerfile: deploy/Dockerfile.srcds
      args:
        RIPEXT_VERSION: ${RIPEXT_VERSION:?set it in deploy/env/versions.env}
        SIGSEGV_MVM_VERSION: ${SIGSEGV_MVM_VERSION:?set it in deploy/env/versions.env}
        SIGSEGV_MVM_SHA256: ${SIGSEGV_MVM_SHA256:?set it in deploy/env/versions.env}
    restart: unless-stopped
    environment:
      SRCDS_HOSTNAME: ${SRCDS_HOSTNAME:-Mann vs Archipelago}
      SRCDS_RCONPW: ${SRCDS_RCONPW:?set SRCDS_RCONPW in .env}
      SRCDS_PW: ${SRCDS_PW:-}
      SRCDS_PORT: ${SRCDS_PORT:-27015}
      SRCDS_MAXPLAYERS: ${SRCDS_MAXPLAYERS:-32}
      SRCDS_STARTMAP: ${SRCDS_STARTMAP:-mvm_decoy}
      SRCDS_START_MISSION: ${SRCDS_START_MISSION:-}
      TF2AP_NEXT_MISSION_DELAY: ${TF2AP_NEXT_MISSION_DELAY:-30}
      TF2AP_BOT_UPGRADES_CHAT: ${TF2AP_BOT_UPGRADES_CHAT:-0}
      SRCDS_TOKEN: ${SRCDS_TOKEN:-0}
      SRCDS_ADMIN_STEAMIDS: ${SRCDS_ADMIN_STEAMIDS:-}
      SRCDS_MODS: ${SRCDS_MODS:-}
      SRCDS_LAN: ${SRCDS_LAN:-1}
      SRCDS_REACH: ${SRCDS_REACH:-}
      SRCDS_BOTS: ${SRCDS_BOTS:-1}
      TF2AP_TEST_MODE: ${TF2AP_TEST_MODE:-0}
      SRCDS_BOT_TEAM_SIZE: ${SRCDS_BOT_TEAM_SIZE:-6}
      SRCDS_BOT_CLASS_BLACKLIST: ${SRCDS_BOT_CLASS_BLACKLIST:-}
      SRCDS_BOT_TEAM_COMP: ${SRCDS_BOT_TEAM_COMP:-}
      SRCDS_BOT_HATS: ${SRCDS_BOT_HATS:-1}
      SRCDS_BOT_HAT_EFFECTS: ${SRCDS_BOT_HAT_EFFECTS:-0}
    ports:
      # The only public port in the stack, and it is the game's.
      - "${SRCDS_PORT:-27015}:${SRCDS_PORT:-27015}/udp"
      - "${SRCDS_PORT:-27015}:${SRCDS_PORT:-27015}/tcp"
      # The bridge's metrics, published here because the bridge has no network
      # of its own: it runs in this container's namespace. Loopback unless
      # BRIDGE_METRICS_BIND says otherwise.
      - "${BRIDGE_METRICS_BIND:-127.0.0.1}:${BRIDGE_METRICS_PORT:-24681}:${BRIDGE_METRICS_PORT:-24681}/tcp"
    volumes:
      - tf2game:/home/steam/tf-dedicated
      # A normal TF2 content tree: maps/, scripts/population/, scripts/items/,
      # materials/, models/, sound/ and scripts/vscripts/ all keep their native
      # paths. Restarting srcds installs files changed on the host.
      - ./community-content:/opt/tf2-community-pack:ro

  bridge:
    build:
      context: .
      dockerfile: deploy/Dockerfile.bridge
    restart: unless-stopped
    # The bridge lives inside the game server's network namespace, so its API
    # really is on loopback: the plugin reaches it at 127.0.0.1 and nothing
    # else can. That namespace is on this stack's network and has the host's
    # resolver, so both a room on archipelago.gg and the `archipelago` service
    # are reachable from it.
    #
    # The cost of sharing it: restarting srcds takes the bridge's networking
    # with it. It restarts on its own, and the checks are on disk, so this
    # costs seconds rather than progress.
    network_mode: "service:srcds"
    environment:
      TF2AP_TEST_MODE: ${TF2AP_TEST_MODE:-0}
      AP_HOST: ${AP_HOST:?set AP_HOST in .env}
      AP_PORT: ${AP_PORT:?set AP_PORT in .env}
      AP_TLS: ${AP_TLS:-false}
      AP_SLOT_NAME: ${AP_SLOT_NAME:-tf2}
      AP_PASSWORD: ${AP_PASSWORD:-}
      BRIDGE_LISTEN: 127.0.0.1:24680
      BRIDGE_STATE: /data/bridge.json
      # Metrics answer on every interface of the shared namespace; what decides
      # who can reach them is the published port above, not this.
      BRIDGE_METRICS_LISTEN: 0.0.0.0:${BRIDGE_METRICS_PORT:-24681}
      # The game server's own port, asked on a scrape how many people are on it.
      # By service name, not 127.0.0.1: srcds binds 0.0.0.0 and answers on its
      # interface addresses, but drops a query sent to loopback.
      BRIDGE_GAME_QUERY: srcds:${SRCDS_PORT:-27015}
    volumes:
      - bridgestate:/data
    # No depends_on. The multiworld is usually not a service in this file at
    # all, and the bridge queues and reconnects on its own either way, so boot
    # order was never what made this correct.

volumes:
  # 14 GB of game files. Keep it.
  tf2game:
  # The seed the `selfhost` profile hosts. Deleting this and restarting rolls a
  # new multiworld, which also means every check recorded so far belongs to a
  # run that no longer exists; the bridge notices the new seed and starts over.
  apoutput:
  # The bridge's check queue and unlock set.
  bridgestate:
