// Archipelago integration.
//
// The bridge shares this container's network namespace, so it is on loopback
// and nothing outside the machine can reach it.
tf2ap_bridge_url "http://127.0.0.1:24680"

// Announce received items and cleared waves in chat. Errors are announced
// whatever this is set to.
tf2ap_announce "1"

// Show what the rest of the multiworld says in chat: hints, items other
// players found, anything typed with !apchat.
tf2ap_chat "1"

// Echo every bridge call and game event to chat and the console. Noisy, and
// the fastest way to see what the server does with a wave.
tf2ap_debug "0"
