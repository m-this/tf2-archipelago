<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mann vs Archipelago</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 32rem; margin: 15vh auto; padding: 0 1.5rem; color: #24292e; }
  a { color: #0366d6; }
  p { margin: 0.5em 0; }
</style>
<script>
  // Redirect on the visitor's own browser language: no server-side logic
  // exists here, this is a static page. French wins on any "fr*" tag
  // (fr, fr-FR, fr-CA, ...); everything else falls back to English.
  var langs = navigator.languages || [navigator.language || ""];
  var wantsFrench = langs.some(function (l) { return /^fr/i.test(l); });
  location.replace(wantsFrench ? "fr/" : "en/");
</script>
</head>
<body>
<noscript>
<p><a href="en/">English</a></p>
<p><a href="fr/">Français</a></p>
</noscript>
<p>Redirecting to <a href="en/">English</a> or <a href="fr/">Français</a>&hellip;</p>
</body>
</html>
